<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From Code to Systems · How AI is turning software development into full-system engineering</title>
  <meta name="description" content="A talk for computer science and computer engineering graduates on the shift from software development to full-system engineering in the AI era.">
  <style>
/* From Code to Systems — presentation microsite
   Visual direction inspired by the Microsoft Ignite 2026 stage: deep night canvas,
   flowing blue-violet-magenta light ribbons, Segoe type, bright cyan accents. */

:root {
  --bg: #07071a;
  --bg-2: #0e0d2b;
  --panel: rgba(255, 255, 255, 0.06);
  --panel-strong: rgba(255, 255, 255, 0.10);
  --line: rgba(255, 255, 255, 0.14);
  --text: #f5f5ff;
  --muted: #b9b8d9;
  --dim: #8584ad;
  --blue: #0078d4;
  --sky: #50e6ff;
  --violet: #8661c5;
  --magenta: #e3008c;
  --amber: #ffb900;
  --green: #6ccb5f;
  --grad: linear-gradient(100deg, #50e6ff 0%, #2f8cff 30%, #8661c5 62%, #e3008c 100%);
  --font: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --radius: 20px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
body { -webkit-font-smoothing: antialiased; }
a { color: var(--sky); text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }

/* ---------- Ambient aurora ---------- */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  background: radial-gradient(120% 90% at 15% 0%, #1a1550 0%, transparent 55%),
              radial-gradient(90% 80% at 100% 100%, #3a0a45 0%, transparent 60%), var(--bg); }
.ribbon { position: absolute; width: 140vw; height: 38vh; left: -20vw; border-radius: 50%;
  filter: blur(60px); opacity: .42; mix-blend-mode: screen; animation: drift 22s ease-in-out infinite alternate; }
.r1 { top: -8vh; background: linear-gradient(90deg, transparent, #0078d4, #50e6ff, transparent); transform: rotate(-8deg); }
.r2 { top: 42vh; background: linear-gradient(90deg, transparent, #8661c5, #e3008c, transparent); transform: rotate(6deg); animation-duration: 28s; opacity: .30; }
.r3 { bottom: -18vh; background: linear-gradient(90deg, transparent, #2f8cff, #8661c5, transparent); transform: rotate(-3deg); animation-duration: 34s; opacity: .25; }
@keyframes drift { from { translate: -6vw 0; } to { translate: 6vw 3vh; } }

/* ---------- Stage & slides ---------- */
#stage { position: relative; z-index: 1; height: 100vh; width: 100vw; }
.slide { position: absolute; inset: 0; padding: clamp(28px, 5vh, 64px) clamp(28px, 6vw, 110px) 90px;
  display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: translateY(18px) scale(.99);
  transition: opacity .55s var(--ease), transform .55s var(--ease), visibility 0s linear .55s; overflow-y: auto; }
.slide.active { opacity: 1; visibility: visible; transform: none; transition: opacity .55s var(--ease), transform .55s var(--ease); }
.slide::-webkit-scrollbar { width: 8px; } .slide::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: clamp(13px, 1.1vw, 17px); letter-spacing: .18em;
  text-transform: uppercase; color: var(--sky); font-weight: 600; margin-bottom: 10px; }
.kicker::before { content: ""; width: 28px; height: 2px; background: var(--grad); border-radius: 2px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.02em; }
h2.title { font-size: clamp(30px, 3.6vw, 60px); line-height: 1.05; }
.subtitle { color: var(--muted); font-size: clamp(16px, 1.4vw, 22px); margin-top: 8px; }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head { margin-bottom: clamp(16px, 3vh, 36px); }

.icon { width: 1em; height: 1em; display: inline-block; vertical-align: middle; flex: none; }
.icon svg { width: 100%; height: 100%; display: block; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px;
  background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.src { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--dim); margin-top: 10px; }
.src a { color: var(--sky); }
.src .icon { font-size: 14px; color: var(--dim); }

.step { opacity: 0; transform: translateY(14px); transition: opacity .45s var(--ease), transform .45s var(--ease); }
.step.on { opacity: 1; transform: none; }

.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

/* ---------- Title ---------- */
.s-title { justify-content: center; }
.s-title .eyebrow { color: var(--sky); letter-spacing: .25em; text-transform: uppercase; font-weight: 600; font-size: clamp(14px, 1.2vw, 18px); }
.s-title h1 { font-size: clamp(52px, 8.4vw, 150px); line-height: .95; margin: 14px 0 18px; }
.s-title .lede { font-size: clamp(18px, 2vw, 32px); color: var(--muted); max-width: 26em; }
.s-title .byline { margin-top: 34px; display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: clamp(14px, 1.2vw, 18px); }
.s-title .byline strong { color: var(--text); }
.icon-rail { display: flex; gap: clamp(10px, 1.6vw, 24px); margin-top: 48px; flex-wrap: wrap; }
.icon-rail .ic { width: clamp(40px, 4vw, 62px); height: clamp(40px, 4vw, 62px); border-radius: 16px; display: grid; place-items: center;
  font-size: clamp(20px, 2vw, 30px); background: var(--panel); border: 1px solid var(--line); color: var(--sky);
  animation: pop .6s var(--ease) both; }
.icon-rail .arrow { align-self: center; color: var(--dim); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.9); } }
.disclaimer { position: absolute; bottom: 70px; left: clamp(28px, 6vw, 110px); font-size: 12px; color: var(--dim); }

/* ---------- Intro ---------- */
.intro-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; max-width: 1100px; }
.intro-item { display: flex; align-items: center; gap: 18px; padding: 22px 26px; font-size: clamp(18px, 1.7vw, 26px); }
.intro-item .icon { font-size: 40px; color: var(--sky); }

/* ---------- Poll ---------- */
.s-poll { justify-content: center; align-items: center; text-align: center; }
.poll-hand { font-size: clamp(80px, 11vw, 170px); color: var(--amber); animation: wave 2.4s ease-in-out infinite; transform-origin: 70% 90%; }
@keyframes wave { 0%, 60%, 100% { rotate: 0deg; } 10%, 30% { rotate: 14deg; } 20%, 40% { rotate: -8deg; } }
.poll-q { font-size: clamp(30px, 4.4vw, 72px); line-height: 1.08; max-width: 18em; margin: 18px 0 26px; }
.poll-follow { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.poll-follow .step { font-size: clamp(18px, 2vw, 32px); color: var(--muted); display: flex; gap: 12px; align-items: center; }
.poll-follow .step .icon { color: var(--amber); }
.poll-punch { margin-top: 26px; font-size: clamp(22px, 2.6vw, 42px); font-weight: 600; }
.tally { display: flex; gap: 10px; margin-top: 22px; justify-content: center; }
.tally button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
.tally button.sel { background: var(--grad); color: #07071a; border-color: transparent; font-weight: 700; }

/* ---------- Shift ---------- */
.shift-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: clamp(16px, 3vw, 48px); align-items: stretch; }
.shift-col { padding: clamp(20px, 3vw, 40px); }
.shift-col h3 { display: flex; align-items: center; gap: 14px; font-size: clamp(22px, 2.4vw, 38px); margin-bottom: 18px; }
.shift-col h3 .icon { font-size: 1.4em; }
.shift-col.then h3 { color: var(--muted); }
.shift-col.now { border-color: rgba(80, 230, 255, .45); box-shadow: 0 0 60px rgba(80, 230, 255, .12) inset; }
.shift-col.now h3 { color: var(--sky); }
.shift-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.shift-col li { font-size: clamp(18px, 1.9vw, 30px); display: flex; gap: 12px; align-items: center; }
.shift-col.then li { color: var(--muted); }
.shift-col li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; opacity: .7; flex: none; }
.shift-arrow { align-self: center; font-size: clamp(40px, 5vw, 80px); color: var(--violet); }
.bigline { margin-top: clamp(20px, 5vh, 56px); font-size: clamp(26px, 3.6vw, 60px); font-weight: 700; line-height: 1.1; }

/* ---------- Reveal ---------- */
.reveal-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; flex: 1; align-content: start; }
.reveal-card { padding: 26px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; min-height: 320px; position: relative; }
.reveal-card .icon.big { font-size: 46px; color: var(--sky); }
.reveal-card .prompt { font-size: clamp(17px, 1.55vw, 24px); line-height: 1.3; }
.reveal-card .answer { margin-top: auto; font-size: clamp(38px, 4.6vw, 76px); font-weight: 800; line-height: 1; display: none; }
.reveal-card.open .answer { display: block; animation: pop .5s var(--ease) both; }
.reveal-card .qmark { margin-top: auto; font-size: clamp(38px, 4.6vw, 76px); font-weight: 800; color: var(--dim); line-height: 1; }
.reveal-card.open .qmark { display: none; }
.reveal-card .note { color: var(--muted); font-size: 15px; opacity: 0; transition: opacity .5s .2s; }
.reveal-card.open .note { opacity: 1; }
.reveal-card .src { opacity: 0; transition: opacity .5s .3s; margin-top: 0; }
.reveal-card.open .src { opacity: 1; }
.takeaway { margin-top: clamp(16px, 4vh, 40px); font-size: clamp(22px, 2.6vw, 42px); font-weight: 600; }

/* ---------- Evidence ---------- */
.evi-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.evi { padding: 22px 24px; display: flex; flex-direction: column; gap: 8px; }
.evi .top { display: flex; align-items: center; gap: 14px; }
.evi .top .icon { font-size: 34px; color: var(--sky); }
.evi .stat { font-size: clamp(28px, 3vw, 50px); font-weight: 800; line-height: 1; }
.evi .label { color: var(--muted); font-size: clamp(15px, 1.25vw, 19px); line-height: 1.35; }
.caveat { margin-top: 20px; color: var(--dim); font-size: 15px; display: flex; gap: 8px; align-items: center; }
.caveat .icon { color: var(--amber); }

/* ---------- Provocation ---------- */
.s-provocation { justify-content: center; align-items: center; }
.flip { perspective: 1600px; width: min(1100px, 90vw); height: min(440px, 56vh); cursor: pointer; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform .9s var(--ease); transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px;
  display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 5vw, 70px); gap: 18px; }
.face.front { background: linear-gradient(135deg, #2a0f3c, #12123a); border: 1px solid rgba(227, 0, 140, .45); }
.face.back { background: linear-gradient(135deg, #062a45, #141a4a); border: 1px solid rgba(80, 230, 255, .5); transform: rotateY(180deg); }
.face .tag { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.face.front .tag { color: #ff6fc4; } .face.back .tag { color: var(--sky); }
.face .say { font-size: clamp(30px, 4.4vw, 72px); font-weight: 700; line-height: 1.08; }
.face.front .say { text-decoration: line-through rgba(227, 0, 140, 0); transition: text-decoration-color .6s; }
.face .icon.giant { position: absolute; right: 40px; top: 36px; font-size: 80px; opacity: .18; }
.vote { display: flex; gap: 14px; margin-top: 10px; }
.vote span { padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 16px; display: inline-flex; gap: 8px; align-items: center; }

/* ---------- Stack ---------- */
.stack-wrap { display: grid; grid-template-columns: minmax(280px, 0.9fr) 1.2fr; gap: clamp(18px, 3vw, 44px); flex: 1; min-height: 0; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.layer { display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  cursor: pointer; transition: all .35s var(--ease); font-size: clamp(14px, 1.25vw, 19px); color: var(--muted); text-align: left; width: 100%; font-family: inherit; }
.layer .num { font-family: var(--mono); font-size: 12px; color: var(--dim); width: 22px; }
.layer .icon { font-size: 22px; color: var(--sky); }
.layer:hover { background: var(--panel-strong); }
.layer.sel { background: linear-gradient(90deg, rgba(0,120,212,.45), rgba(134,97,197,.35)); color: var(--text); border-color: rgba(80,230,255,.6);
  transform: translateX(10px); box-shadow: 0 8px 30px rgba(0, 120, 212, .25); }
.layer.done { color: var(--text); }
.detail { padding: clamp(22px, 3vw, 40px); display: flex; flex-direction: column; gap: 18px; }
.detail .dh { display: flex; align-items: center; gap: 18px; }
.detail .dh .icon { font-size: 64px; color: var(--sky); }
.detail .dh h3 { font-size: clamp(26px, 2.8vw, 46px); }
.kv { display: grid; grid-template-columns: 44px 1fr; gap: 14px 12px; align-items: start; }
.kv .icon { font-size: 28px; }
.kv .k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.kv .v { font-size: clamp(17px, 1.6vw, 25px); }
.kv .ok { color: var(--green); } .kv .bad { color: #ff7a8a; } .kv .sk { color: var(--amber); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pill { padding: 4px 12px; border-radius: 999px; font-size: 14px; background: rgba(255,185,0,.12); border: 1px solid rgba(255,185,0,.35); color: #ffd56b; }
.detail-empty { color: var(--dim); display: grid; place-items: center; text-align: center; font-size: 20px; gap: 12px; }
.detail-empty .icon { font-size: 60px; color: var(--violet); }

/* ---------- Journey ---------- */
.journey-req { font-size: clamp(18px, 1.9vw, 30px); padding: 16px 22px; border-left: 4px solid var(--sky); background: var(--panel); border-radius: 12px; margin-bottom: 18px; font-style: italic; }
.journey-wrap { display: grid; grid-template-columns: minmax(240px, .75fr) 1.25fr; gap: clamp(18px, 3vw, 44px); flex: 1; min-height: 0; }
.track { position: relative; display: flex; flex-direction: column; gap: 4px; }
.track .layer { cursor: default; padding: 7px 14px; }
.packet { position: absolute; left: -16px; width: 12px; height: 12px; border-radius: 50%; background: var(--sky);
  box-shadow: 0 0 0 6px rgba(80,230,255,.2), 0 0 24px var(--sky); transition: top .6s var(--ease); }
.jcard { padding: clamp(22px, 3vw, 38px); display: flex; flex-direction: column; gap: 18px; }
.jcard .stepno { font-family: var(--mono); color: var(--dim); font-size: 14px; }
.jcard .what { font-size: clamp(22px, 2.4vw, 38px); font-weight: 600; line-height: 1.15; }
.jgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.jbox { padding: 16px 18px; border-radius: 14px; display: flex; gap: 12px; align-items: flex-start; font-size: clamp(15px, 1.4vw, 21px); }
.jbox .icon { font-size: 26px; }
.jbox.breaks { background: rgba(255, 80, 110, .1); border: 1px solid rgba(255, 80, 110, .35); }
.jbox.breaks .icon { color: #ff7a8a; }
.jbox.save { background: rgba(108, 203, 95, .1); border: 1px solid rgba(108, 203, 95, .35); }
.jbox.save .icon { color: var(--green); }
.jbox small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }

/* ---------- Trio ---------- */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.trio .t { padding: 30px; display: flex; flex-direction: column; gap: 12px; }
.trio .t .icon { font-size: 60px; color: var(--sky); }
.trio .t h3 { font-size: clamp(22px, 2.2vw, 36px); }
.trio .t .line { color: var(--muted); font-size: clamp(16px, 1.4vw, 21px); }
.trio .t .proof { font-size: 15px; padding-top: 12px; border-top: 1px solid var(--line); }

/* ---------- Skills ---------- */
.skills-wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(16px, 2.5vw, 36px); flex: 1; min-height: 0; }
.skill-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: start; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  color: var(--muted); cursor: pointer; text-align: left; font-family: inherit; font-size: clamp(12px, 1vw, 15px); transition: all .3s var(--ease); }
.tile .icon { font-size: 26px; color: var(--sky); }
.tile:hover { background: var(--panel-strong); color: var(--text); }
.tile.sel { background: linear-gradient(135deg, rgba(0,120,212,.5), rgba(227,0,140,.3)); color: var(--text); border-color: rgba(80,230,255,.6); transform: scale(1.03); }
.tile.seen { color: var(--text); }
.skill-card { perspective: 1600px; min-height: 380px; cursor: pointer; }
.skill-card .flip-inner { min-height: 380px; }
.skill-card .face { justify-content: flex-start; padding: clamp(22px, 2.6vw, 36px); border-radius: 22px; }
.skill-card.flipped .flip-inner { transform: rotateY(180deg); }
.skill-card .face h3 { font-size: clamp(22px, 2.2vw, 36px); display: flex; gap: 14px; align-items: center; }
.skill-card .face h3 .icon { font-size: 1.4em; color: var(--sky); }
.skill-card .why { font-size: clamp(18px, 1.8vw, 28px); line-height: 1.25; font-weight: 600; }
.skill-card .hint { margin-top: auto; color: var(--dim); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.oldnew { display: grid; gap: 12px; }
.oldnew .o, .oldnew .n { padding: 14px 16px; border-radius: 14px; font-size: clamp(15px, 1.4vw, 21px); }
.oldnew .o { background: rgba(255,255,255,.05); color: var(--muted); }
.oldnew .n { background: rgba(80,230,255,.1); border: 1px solid rgba(80,230,255,.35); }
.oldnew small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
details.starter { margin-top: 14px; border-radius: 14px; background: rgba(255,185,0,.08); border: 1px solid rgba(255,185,0,.3); padding: 10px 16px; }
details.starter summary { cursor: pointer; color: #ffd56b; font-weight: 600; display: flex; gap: 8px; align-items: center; list-style: none; }
details.starter summary::-webkit-details-marker { display: none; }
details.starter p { margin: 8px 0 2px; font-size: clamp(15px, 1.3vw, 19px); }

/* ---------- Field stories & cases ---------- */
.field-grid, .case-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.case-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.story { padding: 22px 24px; display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; }
.story > .icon { font-size: 44px; color: var(--sky); grid-row: span 5; }
.story .sector { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.story h3 { font-size: clamp(20px, 1.9vw, 30px); }
.story .row { display: flex; gap: 10px; align-items: flex-start; font-size: clamp(14px, 1.2vw, 18px); color: var(--muted); }
.story .row .icon { font-size: 18px; margin-top: 3px; }
.story .lesson { color: var(--text); font-weight: 600; }
.story .lesson .icon { color: var(--amber); }
.case { padding: 22px; display: flex; flex-direction: column; gap: 6px; }
.case .top { display: flex; justify-content: space-between; align-items: center; }
.case .top .icon { font-size: 32px; color: var(--sky); }
.case .org { font-weight: 700; font-size: clamp(17px, 1.5vw, 23px); }
.case .what { color: var(--dim); font-size: 14px; }
.case .stat { font-size: clamp(30px, 3vw, 50px); font-weight: 800; margin-top: 8px; line-height: 1.05; }
.case .stat.quote { font-size: clamp(24px, 2.2vw, 36px); font-style: italic; }
.case .sl { color: var(--muted); font-size: 15px; }

/* ---------- Roles ---------- */
.legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.legend .lg { display: inline-flex; gap: 8px; align-items: center; font-size: 15px; color: var(--muted); }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dot.now { background: var(--green); } .dot.y1 { background: var(--sky); } .dot.y3 { background: var(--magenta); }
.legend .ln { font-size: 13px; color: var(--dim); font-style: italic; }
.role-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; flex: 1; }
.role-col h4 { margin: 0 0 10px; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; color: var(--muted); }
.role { padding: 16px 18px; margin-bottom: 12px; display: grid; grid-template-columns: 40px 1fr; gap: 4px 12px; }
.role > .icon { font-size: 32px; grid-row: span 3; }
.role.now > .icon { color: var(--green); } .role.y1 > .icon { color: var(--sky); } .role.y3 > .icon { color: #ff6fc4; }
.role h3 { font-size: clamp(17px, 1.5vw, 23px); }
.role .line { color: var(--muted); font-size: 14px; }
.role .proof { font-size: 13px; }
.role.feature { border-color: rgba(108,203,95,.6); box-shadow: 0 0 40px rgba(108,203,95,.15); }

/* ---------- Close ---------- */
.s-close { justify-content: center; align-items: center; text-align: center; }
.s-close .l1 { font-size: clamp(34px, 5vw, 86px); font-weight: 600; color: var(--muted); }
.s-close .l2 { font-size: clamp(42px, 6.4vw, 112px); font-weight: 800; line-height: 1.02; margin-top: 12px; max-width: 14em; }
.s-close .thanks { margin-top: 48px; font-size: clamp(20px, 2vw, 30px); color: var(--muted); }
.s-close .thanks strong { color: var(--text); }

/* ---------- Sources ---------- */
.src-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.src-group { padding: 20px 24px; }
.src-group h3 { font-size: 18px; margin-bottom: 10px; color: var(--sky); }
.src-group ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.src-group a { color: var(--text); }

/* ---------- HUD ---------- */
.hud { position: fixed; z-index: 5; right: 24px; bottom: 18px; display: flex; gap: 8px; align-items: center; }
.hud-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 22px; cursor: pointer; line-height: 1; }
.hud-btn:hover { background: var(--panel-strong); }
.hud-count { font-family: var(--mono); font-size: 13px; color: var(--dim); min-width: 64px; height: 38px; padding: 0 8px;
  border: 0; border-radius: 8px; background: none; text-align: center; cursor: pointer; }
.hud-count:hover, .hud-count:focus-visible { color: var(--sky); background: var(--panel); }
.hud-count:disabled { cursor: default; }
.slide-picker { width: min(520px, calc(100vw - 32px)); max-width: none; max-height: min(640px, calc(100dvh - 48px));

.slide-picker[open] { display: flex; flex-direction: column; }
.slide-picker::backdrop { background: var(--bg); opacity: .8; }
.slide-picker-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 12px; }
.slide-picker-head h2 { font-size: 18px; }
.slide-picker-head .hud-btn { width: 32px; height: 32px; font-size: 20px; }
.jump-list { list-style: none; margin: 0; padding: 6px; min-height: 0; overflow-y: auto; display: grid; gap: 4px;
  scrollbar-width: thin; scrollbar-color: var(--line) var(--bg-2); }
.jump-item { display: flex; gap: 14px; align-items: baseline; width: 100%; padding: 10px 12px; border: 1px solid transparent;
  border-radius: 10px; background: none; color: var(--muted); font: inherit; font-size: 14px; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.jump-item:hover, .jump-item[aria-current="true"] { background: var(--panel); border-color: var(--line); color: var(--text); }
.jump-number { font-family: var(--mono); font-size: 12px; color: var(--dim); flex: none; }
.jump-item[aria-current="true"] .jump-number { color: var(--sky); }
.slide-picker-hint { margin: 12px 6px 0; color: var(--dim); font-size: 12px; }
.progress { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.06); }
.progress span { display: block; height: 100%; width: 0; background: var(--grad); transition: width .5s var(--ease); }
.blackout { position: fixed; inset: 0; z-index: 20; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s; }
.blackout.on { opacity: 1; pointer-events: auto; }
.keyhint { position: fixed; z-index: 5; left: 24px; bottom: 22px; font-size: 12px; color: var(--dim); transition: opacity 1s; }
.keyhint.hide { opacity: 0; }
.noscript { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .reveal-grid, .evi-grid, .trio, .case-grid, .role-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .skills-wrap, .stack-wrap, .journey-wrap { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .reveal-grid, .evi-grid, .trio, .case-grid, .role-cols, .field-grid, .intro-grid, .src-grid, .jgrid { grid-template-columns: 1fr; }
  .shift-row { grid-template-columns: 1fr; } .shift-arrow { rotate: 90deg; justify-self: center; }
  .skill-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .keyhint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
@media print {
  html, body { overflow: visible; height: auto; }
  .aurora, .hud, .progress, .keyhint, .blackout, .slide-picker[open] { display: none; }
  #stage { height: auto; }
  .slide { position: relative; opacity: 1; visibility: visible; transform: none; page-break-after: always; min-height: 100vh; }
  .step, .reveal-card .note, .reveal-card .src { opacity: 1 !important; transform: none !important; }
}

  function icon(name, cls) {
    var body = ICONS[name] || ICONS.compass;
    return '<span class="icon' + (cls ? " " + cls : "") + '" aria-hidden="true"><svg viewBox="0 0 24 24" ' + P + ">" + body + "</svg></span>";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function src(label, url) {
    if (!url) return "";
    return '<div class="src">' + icon("link") + '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label) + "</a></div>";
  }
  function head(s) {
    return '<header class="head">' + (s.kicker ? '<div class="kicker">' + esc(s.kicker) + "</div>" : "") +
      (s.title ? '<h2 class="title">' + esc(s.title) + "</h2>" : "") +
      (s.subtitle ? '<p class="subtitle">' + esc(s.subtitle) + "</p>" : "") + "</header>";
  }
  function onSteps(el, n) {
    el.querySelectorAll("[data-step]").forEach(function (x) {
      x.classList.toggle("on", Number(x.getAttribute("data-step")) <= n);
    });
  }

  /* ---------- Renderers: each returns { html, steps, apply(el, n), bind(el, go) } ---------- */
  var R = {};

  R.title = function (s, meta) {
    var rail = s.icons.map(function (n, i) {
      return '<span class="ic" style="animation-delay:' + (0.15 + i * 0.08) + 's">' + icon(n) + "</span>" +
        (i < s.icons.length - 1 ? '<span class="arrow">›</span>' : "");
    }).join("");
    return {
      steps: 0,
      html: '<div class="eyebrow">' + esc(s.kicker) + "</div>" +
        '<h1><span class="grad-text">' + esc(s.title) + "</span></h1>" +
        '<p class="lede">' + esc(s.subtitle) + "</p>" +
        '<div class="icon-rail" aria-label="The execution stack, from human to container">' + rail + "</div>" +
        '<div class="byline">' + icon("person") + "<span><strong>" + esc(meta.speaker) + "</strong> · " + esc(meta.role) + "</span></div>" +
        '<p class="disclaimer">' + esc(meta.disclaimer) + "</p>"
    };
  };

  R.intro = function (s) {
    var items = s.points.map(function (p, i) {
      return '<div class="intro-item glass step" data-step="' + (i + 1) + '">' + icon(p.icon) + "<span>" + esc(p.text) + "</span></div>";
    }).join("");
    return { steps: s.points.length, html: head(s) + '<div class="intro-grid">' + items + "</div>", apply: onSteps };
  };

  R.poll = function (s) {
    var f = s.followups.map(function (t, i) {
      return '<div class="step" data-step="' + (i + 1) + '">' + icon("hand") + "<span>" + esc(t) + "</span></div>";
    }).join("");
    var n = s.followups.length + 1;
    return {
      steps: n,
      html: '<div class="kicker">' + esc(s.kicker) + "</div>" + '<div class="poll-hand">' + icon("hand") + "</div>" +
        '<h2 class="poll-q">' + esc(s.question) + "</h2>" + '<div class="poll-follow">' + f + "</div>" +
        '<div class="poll-punch step grad-text" data-step="' + n + '">' + esc(s.punch) + "</div>" +
        '<div class="tally" role="group" aria-label="Room read">' +
        '<button type="button">Few hands</button><button type="button">About half</button><button type="button">Most hands</button></div>',
      apply: onSteps,
      bind: function (el) {
        var bs = el.querySelectorAll(".tally button");
        bs.forEach(function (b) {
          b.addEventListener("click", function (e) {
            e.stopPropagation();
            bs.forEach(function (x) { x.classList.toggle("sel", x === b && !b.classList.contains("sel")); });
          });
        });
      }
    };

  R.shift = function (s) {
    function col(c, cls, st) {
      return '<div class="shift-col glass ' + cls + (st ? ' step" data-step="' + st + '"' : '"') + ">" +
        "<h3>" + icon(c.icon) + esc(c.label) + "</h3><ul>" + c.items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul></div>";
    }
    return {
      steps: 2,
      html: head(s) + '<div class="shift-row">' + col(s.from, "then") + '<div class="shift-arrow step" data-step="1">' + icon("arrowright") + "</div>" +
        col(s.to, "now", 1) + "</div>" + '<div class="bigline step" data-step="2"><span class="grad-text">' + esc(s.bigline) + "</span></div>",
      apply: onSteps
    };
  };

  R.reveal = function (s) {
    var cards = s.items.map(function (it, i) {
      return '<div class="reveal-card glass" data-i="' + i + '" role="button" tabindex="0" aria-label="Reveal answer">' +
        icon(it.icon, "big") + '<div class="prompt">' + esc(it.prompt) + "</div>" +
        '<div class="qmark">?</div><div class="answer grad-text">' + esc(it.answer) + "</div>" +
        '<div class="note">' + esc(it.note) + "</div>" + src(it.source, it.url) + "</div>";
    }).join("");
    var n = s.items.length + 1;
    return {
      steps: n,
      html: head(s) + '<div class="reveal-grid">' + cards + "</div>" +
        '<div class="takeaway step" data-step="' + n + '">' + esc(s.takeaway) + "</div>",
      apply: function (el, k) {
        el.querySelectorAll(".reveal-card").forEach(function (c, i) { c.classList.toggle("open", i < k); });
        onSteps(el, k);
      },
      bind: function (el) {
        el.querySelectorAll(".reveal-card").forEach(function (c) {
          function t() { c.classList.toggle("open"); }
          c.addEventListener("click", function (e) { if (e.target.closest("a")) return; e.stopPropagation(); t(); });
          c.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.stopPropagation(); t(); } });
        });
      }
    };
  };

  R.evidence = function (s) {
    var cards = s.cards.map(function (c, i) {
      return '<div class="evi glass step" data-step="' + (i + 1) + '"><div class="top">' + icon(c.icon) +
        '<div class="stat grad-text">' + esc(c.stat) + '</div></div><div class="label">' + esc(c.label) + "</div>" + src(c.source, c.url) + "</div>";
    }).join("");
    return {
      steps: s.cards.length,
      html: head(s) + '<div class="evi-grid">' + cards + "</div>" + '<div class="caveat">' + icon("alert") + esc(s.caveat) + "</div>",
      apply: onSteps
    };
  };

  R.provocation = function (s) {
    return {
      steps: 1,
      html: '<div class="flip" role="button" tabindex="0" aria-label="Flip">' +
        '<div class="flip-inner">' +
        '<div class="face front">' + icon(s.icon, "giant") + '<div class="tag">' + icon("alert") + esc(s.kicker) + "</div>" +
        '<div class="say">' + esc(s.myth) + "</div>" +
        '<div class="vote"><span>' + icon("hand") + "Myth</span><span>" + icon("hand") + "Fact</span></div></div>" +
        '<div class="face back">' + icon("lightbulb", "giant") + '<div class="tag">' + icon("flip") + "Flip it</div>" +
        '<div class="say grad-text">' + esc(s.flip) + "</div></div>" +
        "</div></div>",
      apply: function (el, k) { el.querySelector(".flip").classList.toggle("flipped", k >= 1); },
      bind: function (el) {
        var f = el.querySelector(".flip");

      }
    };

  function layerDetail(L, idx) {
    return '<div class="dh">' + icon(L.icon) + '<div><div class="kicker">Layer ' + (idx + 1) + "</div><h3>" + esc(L.name) + "</h3></div></div>" +
      '<div class="kv">' +
      '<span class="ok">' + icon("wrench") + '</span><div><div class="k">You engineer</div><div class="v">' + esc(L.engineer) + "</div></div>" +
      '<span class="bad">' + icon("alert") + '</span><div><div class="k">What breaks</div><div class="v">' + esc(L.risk) + "</div></div>" +
      '<span class="sk">' + icon("target") + '</span><div><div class="k">Skills that save you</div><div class="pills">' +

      src(L.source, L.url);

  R.stack = function (s) {
    var layers = s.layers.map(function (L, i) {
      return '<button type="button" class="layer" data-i="' + i + '"><span class="num">' + String(i + 1).padStart(2, "0") + "</span>" + icon(L.icon) + "<span>" + esc(L.name) + "</span></button>";
    }).join("");
    return {
      steps: s.layers.length,
      html: head(s) + '<div class="stack-wrap"><div class="stack">' + layers + "</div>" +
        '<div class="detail glass"><div class="detail-empty">' + icon("layers") + "<div>Ten layers. One system.<br>Click or advance to explore.</div></div></div></div>",
      apply: function (el, k) {
        var d = el.querySelector(".detail");
        el.querySelectorAll(".layer").forEach(function (b, i) { b.classList.toggle("sel", i === k - 1); b.classList.toggle("done", i < k - 1); });
        d.innerHTML = k === 0 ? '<div class="detail-empty">' + icon("layers") + "<div>Ten layers. One system.<br>Click or advance to explore.</div></div>" : layerDetail(s.layers[k - 1], k - 1);
      },
      bind: function (el, go) {
        el.querySelectorAll(".layer").forEach(function (b) {
          b.addEventListener("click", function (e) { e.stopPropagation(); go(Number(b.getAttribute("data-i")) + 1); });
        });
      }
    };
  };

  R.journey = function (s, meta, all) {
    var stack = all.filter(function (x) { return x.type === "stack"; })[0];
    var layers = stack ? stack.layers : [];
    var idx = {}; layers.forEach(function (L, i) { idx[L.id] = i; });
    var track = layers.map(function (L, i) {
      return '<div class="layer" data-i="' + i + '"><span class="num">' + String(i + 1).padStart(2, "0") + "</span>" + icon(L.icon) + "<span>" + esc(L.name) + "</span></div>";
    }).join("");
    var n = s.steps.length + 1;
    function card(k) {
      if (k === 0) return '<div class="detail-empty">' + icon("chat") + "<div>Advance to send the request<br>through the stack.</div></div>";
      if (k > s.steps.length) return '<div class="detail-empty">' + icon("lightbulb") + '<div class="what grad-text" style="font-size:clamp(24px,2.6vw,42px);font-weight:700">' + esc(s.takeaway) + "</div></div>";
      var st = s.steps[k - 1], L = layers[idx[st.layer]] || { name: st.layer, icon: "compass" };
      return '<div class="stepno">HOP ' + k + " / " + s.steps.length + " · " + esc(L.name).toUpperCase() + "</div>" +
        '<div class="what">' + esc(st.what) + "</div>" +
        '<div class="jgrid"><div class="jbox breaks">' + icon("alert") + "<div><small>What could break</small>" + esc(st.breaks) + "</div></div>" +
        '<div class="jbox save">' + icon("shieldcheck") + "<div><small>What saves you</small>" + esc(st.save) + "</div></div></div>";
    }
    return {
      steps: n,
      html: head(s) + '<div class="journey-req">' + esc(s.request) + "</div>" +
        '<div class="journey-wrap"><div class="track">' + track + '<span class="packet" style="top:-40px;opacity:0"></span></div><div class="jcard glass"></div></div>',
      apply: function (el, k) {
        el.querySelector(".jcard").innerHTML = card(k);
        var cur = k >= 1 && k <= s.steps.length ? idx[s.steps[k - 1].layer] : -1;
        var rows = el.querySelectorAll(".track .layer");
        rows.forEach(function (r, i) { r.classList.toggle("sel", i === cur); });
        var pk = el.querySelector(".packet");
        if (cur >= 0 && rows[cur]) { pk.style.opacity = 1; pk.style.top = (rows[cur].offsetTop + rows[cur].offsetHeight / 2 - 6) + "px"; }
        else pk.style.opacity = 0;
      }
    };
  };

  R.trio = function (s) {
    var items = s.items.map(function (t, i) {
      return '<div class="t glass step" data-step="' + (i + 1) + '">' + icon(t.icon) + "<h3>" + esc(t.name) + '</h3><div class="line">' + esc(t.line) + "</div>" +
        '<div class="proof">' + esc(t.proof) + "</div>" + src("Source", t.url) + "</div>";

  R.skills = function (s) {
    var tiles = s.skills.map(function (k, i) {
      return '<button type="button" class="tile" data-i="' + i + '">' + icon(k.icon) + "<span>" + esc(k.name) + "</span></button>";

    function card(i, flipped) {
      if (i < 0) return '<div class="glass detail-empty" style="min-height:380px">' + icon("target") + "<div>" + s.skills.length + " skills.<br>Advance or click a tile.</div></div>";
      var k = s.skills[i];
      return '<div class="skill-card' + (flipped ? " flipped" : "") + '" role="button" tabindex="0" aria-label="Flip card"><div class="flip-inner">' +
        '<div class="face front"><h3>' + icon(k.icon) + esc(k.name) + '</h3><div class="why">' + esc(k.why) + "</div>" + src(k.source, k.url) +
        '<div class="hint">' + icon("flip") + "Click or advance: old way vs. AI way</div></div>" +
        '<div class="face back"><h3>' + icon(k.icon) + esc(k.name) + "</h3>" +
        '<div class="oldnew"><div class="o"><small>Old way</small>' + esc(k.old) + '</div><div class="n"><small>AI-era way</small>' + esc(k.ai) + "</div></div>" +
        '<details class="starter"><summary>' + icon("rocket") + "Starter move</summary><p>" + esc(k.starter) + "</p></details></div>" +
        "</div></div>";
    }
    var pane;
    function render(el) {
      pane.innerHTML = card(state.sel, state.flipped);
      el.querySelectorAll(".tile").forEach(function (t, i) { t.classList.toggle("sel", i === state.sel); });
      var c = pane.querySelector(".skill-card");
      if (c) c.addEventListener("click", function (e) {
        if (e.target.closest("details") || e.target.closest("a")) { e.stopPropagation(); return; }
        e.stopPropagation(); state.flipped = !state.flipped; c.classList.toggle("flipped", state.flipped);
      });
    }
    return {
      steps: s.skills.length * 2,
      html: head(s) + '<div class="skills-wrap"><div class="skill-grid">' + tiles + '</div><div class="skill-pane"></div></div>',
      apply: function (el, k) {
        pane = el.querySelector(".skill-pane");
        state.sel = k === 0 ? -1 : Math.ceil(k / 2) - 1;
        state.flipped = k > 0 && k % 2 === 0;
        el.querySelectorAll(".tile").forEach(function (t, i) { t.classList.toggle("seen", i < state.sel); });
        render(el);
      },
      bind: function (el, go) {
        el.querySelectorAll(".tile").forEach(function (t) {
          t.addEventListener("click", function (e) { e.stopPropagation(); go(Number(t.getAttribute("data-i")) * 2 + 1); });
        });
      }
    };
  };

  };

  R.sources = function (s) {
    var g = s.groups.map(function (gr) {
      return '<div class="src-group glass"><h3>' + esc(gr.name) + "</h3><ol>" +
        gr.items.map(function (it) { return '<li><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.t) + "</a></li>"; }).join("") +
        "</ol></div>";
    }).join("");
    return { steps: 0, html: head(s) + '<div class="src-grid">' + g + "</div>" };
  };

  /* ---------- Engine ---------- */
  var stage = document.getElementById("stage");
  var counter = document.getElementById("counter");
  var picker = document.getElementById("slidePicker");
  var slideList = document.getElementById("slideList");
  var slides = [], cur = 0, step = 0;

  function build(data) {
    document.title = data.meta.title + " · " + data.meta.subtitle;
    data.sections.forEach(function (s, i) {
      var r = (R[s.type] || R.sources)(s, data.meta, data.sections);
      var el = document.createElement("section");
      el.className = "slide s-" + s.type;
      el.id = s.id;
      el.setAttribute("aria-label", s.title || s.question || s.myth || s.line || s.kicker || s.id);
      el.innerHTML = r.html;
      stage.appendChild(el);
      var obj = { el: el, r: r, s: s };
      if (r.bind) r.bind(el, function (k) { goStep(i, k); });
      slides.push(obj);
    });
    slideList.innerHTML = slides.map(function (sl, i) {
      return '<li><button type="button" class="jump-item"><span class="jump-number">' +
        String(i + 1).padStart(2, "0") + '</span><span>' + esc(sl.el.getAttribute("aria-label")) + "</span></button></li>";
    }).join("");
    slideList.querySelectorAll("button").forEach(function (button, i) {
      button.addEventListener("click", function () {
        picker.close();
        slides[i].el.scrollTop = 0;
        show(i, 0);
      });
    });
    counter.disabled = false;
    var h = (location.hash || "").replace("#", "").split("/");
    var si = slides.findIndex(function (x) { return x.s.id === h[0]; });
    show(si >= 0 ? si : 0, si >= 0 ? Math.min(Number(h[1]) || 0, slides[si].r.steps || 0) : 0);
  }

  function show(i, k) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    var sl = slides[cur];
    step = Math.max(0, Math.min(sl.r.steps || 0, k));
    slides.forEach(function (x, j) { x.el.classList.toggle("active", j === cur); x.el.setAttribute("aria-hidden", j === cur ? "false" : "true"); });
    if (sl.r.apply) sl.r.apply(sl.el, step);
    counter.textContent = (cur + 1) + " / " + slides.length;
    counter.setAttribute("aria-label", "Jump to slide (current: " + (cur + 1) + " of " + slides.length + ")");
    var total = slides.length - 1 || 1;
    var frac = (cur + (sl.r.steps ? step / (sl.r.steps + 1) : 0)) / total;
    document.getElementById("progressBar").style.width = Math.min(100, frac * 100) + "%";
    history.replaceState(null, "", "#" + sl.s.id + (step ? "/" + step : ""));
  }
  function goStep(i, k) { show(i, k); }
  function next() {
    var sl = slides[cur];
    if (step < (sl.r.steps || 0)) show(cur, step + 1);
    else if (cur < slides.length - 1) { slides[cur + 1].el.scrollTop = 0; show(cur + 1, 0); }
  }
  function prev() {
    if (step > 0) show(cur, step - 1);
    else if (cur > 0) show(cur - 1, slides[cur - 1].r.steps || 0);
  }

  function openPicker() {
    if (counter.disabled || picker.open) return;
    var buttons = slideList.querySelectorAll("button");
    buttons.forEach(function (button, i) {
      if (i === cur) button.setAttribute("aria-current", "true");
      else button.removeAttribute("aria-current");
    });
    picker.showModal();
    counter.setAttribute("aria-expanded", "true");
    buttons[cur].focus();
    buttons[cur].scrollIntoView({ block: "nearest" });
    hint();
  }

  document.addEventListener("keydown", function (e) {
    if (picker.open) {
      if (e.key === "Escape") { e.preventDefault(); picker.close(); }
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    var bo = document.getElementById("blackout");
    var k = e.key;
    if (k === "b" || k === "B" || k === "." ) { bo.classList.toggle("on"); e.preventDefault(); return; }
    if (bo.classList.contains("on")) { bo.classList.remove("on"); e.preventDefault(); return; }
    if (k === "g" || k === "G") { e.preventDefault(); openPicker(); return; }
    if (k === " " && t === counter) return;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter", "n", "N"].indexOf(k) >= 0) {
      if (k === "Enter" && t && t.closest && (t.closest("summary") || t.closest("a") || t.closest("button") || t.closest("[role=button]"))) return;
      e.preventDefault(); next();
    } else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace", "p", "P"].indexOf(k) >= 0) {
      e.preventDefault(); prev();
    } else if (k === "Home") { e.preventDefault(); show(0, 0); }
    else if (k === "End") { e.preventDefault(); show(slides.length - 1, 0); }
    hint();
  });
  document.getElementById("nextBtn").addEventListener("click", function (e) { e.stopPropagation(); next(); });
  document.getElementById("prevBtn").addEventListener("click", function (e) { e.stopPropagation(); prev(); });
  counter.addEventListener("click", openPicker);
  document.getElementById("closePicker").addEventListener("click", function () { picker.close(); });
  picker.addEventListener("close", function () {
    counter.setAttribute("aria-expanded", "false");
    counter.focus();
  });
  picker.addEventListener("click", function (e) {
    if (e.target !== picker) return;
    var rect = picker.getBoundingClientRect();
    if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) picker.close();
  });

  var hintTimer;
  function hint() {
    var h = document.getElementById("keyhint");
    h.classList.add("hide");
    clearTimeout(hintTimer);
  }
  hintTimer = setTimeout(hint, 9000);
  window.addEventListener("resize", function () { var sl = slides[cur]; if (sl && sl.r.apply) sl.r.apply(sl.el, step); });

  /* ---------- Load content: embedded copy first (works offline / file://), else content.json ---------- */
  var embedded = document.getElementById("talk-data");
  if (embedded) {
    build(JSON.parse(embedded.textContent));
  } else {
    fetch("content.json").then(function (r) { return r.json(); }).then(build).catch(function () {
      stage.innerHTML = '<section class="slide active" style="justify-content:center;align-items:center;text-align:center"><h2 class="title">Content could not load</h2>' +
        '<p class="subtitle">Open the single-file version, or serve this folder from a local web server.</p></section>';
    });
  }
})();
</script>
</body>
</html>
