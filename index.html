<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From Code to Systems · How AI is turning software development into full-system engineering</title>
  <meta name="description" content="A talk for computer science and computer engineering graduates on the shift from software development to full-system engineering in the AI era.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="ribbon r1"></span><span class="ribbon r2"></span><span class="ribbon r3"></span>
  </div>

  <main id="stage" aria-live="polite"></main>

  <nav class="hud" aria-label="Presentation controls">
    <button class="hud-btn" id="prevBtn" aria-label="Previous">&#8249;</button>
    <button class="hud-count" id="counter" type="button" aria-label="Jump to slide" aria-haspopup="dialog" aria-controls="slidePicker" aria-expanded="false" aria-keyshortcuts="G" title="Jump to slide (G)" disabled>1 / 1</button>
    <button class="hud-btn" id="nextBtn" aria-label="Next">&#8250;</button>
  </nav>
  <dialog class="slide-picker" id="slidePicker" aria-labelledby="slidePickerTitle">
    <header class="slide-picker-head">
      <h2 id="slidePickerTitle">Jump to slide</h2>
      <button class="hud-btn" id="closePicker" type="button" aria-label="Close slide picker">&#215;</button>
    </header>
    <ol class="jump-list" id="slideList"></ol>
    <p class="slide-picker-hint">Choose a slide &middot; Esc to close</p>
  </dialog>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <div class="blackout" id="blackout" aria-hidden="true"></div>
  <div class="keyhint" id="keyhint">→ / Space / clicker: next · ← back · G: jump to slide · B: black screen · Home / End</div>

  <noscript><p class="noscript">This talk needs JavaScript to present.</p></noscript>
  <!--TALK-DATA-->
  <script src="app.js"></script>
</body>
</html>
