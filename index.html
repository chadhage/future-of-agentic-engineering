<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From Code to Systems · How AI is turning software development into full-system engineering</title>
  <meta name="description" content="A talk for computer science and computer engineering graduates on the shift from software development to full-system engineering in the AI era.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="ribbon r1"></span><span class="ribbon r2"></span><span class="ribbon r3"></span>
  </div>

  <main id="stage" aria-live="polite"></main>

  <div class="talk-timer" id="presentationTimer" role="group" aria-label="Presentation timer">
    <button class="timer-display" id="timerSettingsBtn" type="button" aria-label="Timer settings" aria-describedby="timerLabel timerValue" aria-haspopup="dialog" aria-controls="timerSettings" aria-expanded="false" aria-keyshortcuts="T" title="Timer settings (T)">
      <span class="timer-label" id="timerLabel">Elapsed</span>
      <span class="timer-value" id="timerValue" role="timer" aria-live="off">00:00</span>
    </button>
    <button class="timer-toggle" id="timerToggle" type="button" aria-label="Start presentation timer" title="Start timer"></button>
  </div>
  <nav class="hud" aria-label="Presentation controls">
    <button class="hud-btn" id="prevBtn" aria-label="Previous">&#8249;</button>
    <button class="hud-count" id="counter" type="button" aria-label="Jump to slide" aria-haspopup="dialog" aria-controls="slidePicker" aria-expanded="false" aria-keyshortcuts="G" title="Jump to slide (G)" disabled>1 / 1</button>
    <button class="hud-btn" id="nextBtn" aria-label="Next">&#8250;</button>
  </nav>
  <dialog class="slide-picker" id="slidePicker" aria-labelledby="slidePickerTitle">
    <header class="slide-picker-head">
      <h2 id="slidePickerTitle">Jump to slide</h2>
      <button class="hud-btn" id="closePicker" type="button" aria-label="Close slide picker">&#215;</button>
    </header>
    <ol class="jump-list" id="slideList"></ol>
    <p class="slide-picker-hint">Choose a slide &middot; Esc to close</p>
  </dialog>
  <dialog class="slide-picker timer-settings" id="timerSettings" aria-labelledby="timerSettingsTitle">
    <header class="slide-picker-head">
      <h2 id="timerSettingsTitle">Timer settings</h2>
      <button class="hud-btn" id="closeTimerSettings" type="button" aria-label="Close timer settings">&#215;</button>
    </header>
    <form class="timer-form" id="timerForm">
      <label>Presentation length (minutes)
        <input id="timerMinutes" type="number" min="1" step="1" value="20" inputmode="numeric" required>
      </label>
      <label>Display
        <select id="timerMode">
          <option value="elapsed">Elapsed time (count up)</option>
          <option value="countdown">Countdown</option>
        </select>
      </label>
      <label>Start mode
        <select id="timerStartMode">
          <option value="auto">Automatically on first advance</option>
          <option value="manual">Manually with Start</option>
        </select>
      </label>
      <p class="timer-help">Apply keeps elapsed time. Reset starts fresh using these settings. Start mode applies before the timer starts or after a reset.</p>
      <div class="timer-actions">
        <button id="timerReset" type="button">Reset timer</button>
        <button class="timer-apply" type="submit">Apply</button>
      </div>
    </form>
  </dialog>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <div class="blackout" id="blackout" aria-hidden="true"></div>
  <div class="keyhint" id="keyhint">→ / Space / clicker: next · ← back · G: jump to slide · B: black screen · Home / End</div>

  <noscript><p class="noscript">This talk needs JavaScript to present.</p></noscript>
  <!--TALK-DATA-->
  <script src="app.js"></script>
</body>
</html>
